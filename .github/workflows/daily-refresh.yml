name: Daily Data Refresh

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push commits
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run fetch and extract
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python automation/fetch_and_track.py
          python automation/extract_structured.py
          python automation/extract_loan_rates.py

      - name: Load manual snapshots
        run: python automation/load_manual_snapshots.py

      # Regenerates the chat-facing documents (data/raw/*.txt's AUTO
      # blocks) from the database this run just updated, rebuilds the
      # FAISS index from them, then runs both content-level verify
      # tools against the result -- all in one step/shell script (not
      # four), so a mid-sequence failure is caught by THIS script
      # itself rather than relying on step-level go/no-further-steps
      # behavior, and the whole sequence's real stdout/stderr (which
      # command, what error) lands in one place in the run log.
      #
      # All-or-nothing, by design: if any of the four commands fails,
      # data/raw/ and indexes/ are reverted to HEAD and never staged --
      # a half-regenerated document set or a half-built index must
      # never reach a commit. The database commit below still goes
      # ahead regardless (set +e / exit 0 here, not a hard step
      # failure, so the next step still runs) -- Phase B (the
      # structured DB) and Phase A (the chat documents) are
      # deliberately independent pipelines, and a failure in one was
      # never meant to block the other. The failure is still fully
      # visible: ::error:: annotates the job summary, and every
      # command's own real output stays in this step's log untouched.
      - name: Sync chat documents, rebuild index, verify
        run: |
          set +e
          FAILED=0
          python automation/sync_rag_docs.py || FAILED=1
          python build_index.py || FAILED=1
          python automation/verify_all.py || FAILED=1
          python automation/verify_index_freshness.py || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Chat-document sync, index rebuild, or verification failed -- data/raw/ and indexes/ will NOT be committed this run (see the failing command's own output above). The database commit still proceeds separately."
            git checkout -- data/raw/ indexes/ 2>/dev/null || true
            exit 0
          fi

          if git diff --quiet -- data/raw/ indexes/; then
            echo "documents unchanged"
          else
            git add data/raw/ indexes/
            echo "documents changed -- staged for commit"
          fi

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/automation.duckdb
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "Automated data refresh $(date +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          echo "Failed to push after 3 attempts"
          exit 1