name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vittam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check - index freshness
        run: docker run --rm vittam:ci python automation/verify_index_freshness.py

      - name: Check - content and calculations
        run: docker run --rm vittam:ci python automation/verify_all.py

      - name: Check - tenure coverage
        run: docker run --rm vittam:ci python automation/verify_coverage.py