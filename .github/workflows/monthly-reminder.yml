name: Post-MPC Vittam Check

# Opens a GitHub Issue on the 1st of every SECOND month (roughly
# tracking RBI's own bi-monthly Monetary Policy Committee cycle --
# renamed 2026-11-07 from the original monthly cadence to match) with a
# short manual checklist -- things no automated workflow in this repo
# checks for itself (does chat actually sound right, do the numbers
# match the banks' own pages, are the manual snapshots still current).
# Skips creating a new issue if one with the same title is still open,
# so a cycle someone hasn't gotten to yet doesn't pile up duplicates.
#
# `*/2` in the month field fires on odd months (Jan/Mar/May/Jul/Sep/
# Nov) -- this is a plain bi-monthly cadence, not aligned to RBI's own
# real MPC meeting dates (see README's refresh section for the actual
# published dates, where known; this schedule wasn't adjusted to match
# them precisely).
on:
  schedule:
    - cron: '0 3 1 */2 *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  monthly-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Create monthly check issue (skip if one is already open)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # No heredoc -- a previous version used `cat <<'BODY' ... BODY`,
        # but YAML's block-literal indentation means the closing "BODY"
        # line is never actually at column 0 the way a heredoc
        # terminator must be, so bash never found it and just hung
        # waiting for more input forever (confirmed directly: a real
        # test run sat "in progress" for 11+ minutes with nothing
        # happening, toward GitHub's 6-hour default job timeout, before
        # being cancelled). printf with one double-quoted line per
        # argument avoids the problem entirely -- no heredoc, no
        # indentation-sensitive terminator -- and double quotes (not
        # single) are required here since the real body text has
        # apostrophes ("Union Bank's", "banks' own") that would end a
        # single-quoted string early; the two literal backticks are
        # escaped so they don't trigger command substitution.
        run: |
          TITLE="Post-MPC Vittam check (RBI policy meeting just held)"
          QUERY="\"$TITLE\" in:title"
          EXISTING=$(gh issue list --search "$QUERY" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "An open '$TITLE' issue already exists -- skipping."
            exit 0
          fi
          printf "%s\n" \
            "Bi-monthly manual check-in, timed to RBI's own policy cycle. Go through each item and check it off; close this issue once all five are done." \
            "" \
            "- [ ] Ask 5 chat questions (a mix of General Chat and at least one bank-scoped question) and confirm the answers look right." \
            "- [ ] Compare 3 FD/loan rates shown in Compare Rates against the banks' own published pages." \
            "- [ ] Refresh the IBA News snapshot (\`python automation/iba_news.py --snapshot\`)." \
            "- [ ] Re-copy Union Bank's FD rate table from its own page into \`data/manual/union_bank_fd.csv\`." \
            "- [ ] Re-copy BOI's FD table by hand (its site is still blocked -- see README Known Limitations). Indian Bank is now live-fetched automatically and no longer needs this." \
            > issue_body.md
          gh issue create --title "$TITLE" --body-file issue_body.md
